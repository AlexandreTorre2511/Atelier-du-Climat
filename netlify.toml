# Le site est dans site/ : sans cette ligne Netlify publie la racine du depot,
# qui ne contient pas d'index.html.
[build]
  publish = "site"
  functions = "site/netlify/functions"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Publie le dossier site/ sur GitHub Pages à chaque push sur main.
# Le site est statique : rien n'est construit, les fichiers sont servis tels quels.
name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jetons nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # site/.nojekyll est versionné : il empêche GitHub d'ignorer les
      # fichiers commençant par « _ ».
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v4
